<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リズムタップゲーム（タイミング版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

  <style>
    body {
      background: #111;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }
    nav {
      background: #222;
    }
    main.container {
      margin-top: 2rem;
    }
    #gameArea {
      position: relative;
      margin: 0 auto;
      width: 300px;
      height: 500px;
      border: 2px solid #fff;
      background: #000;
      overflow: hidden;
    }
    .tile {
      position: absolute;
      top: -100px;
      left: 0;
      width: 100%;
      height: 100px;
      background: #0af;
      border-radius: 5px;
    }
    #hitLine {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      height: 5px;
      background: red;
    }
    #scoreBoard {
      margin-top: 1rem;
      font-size: 1.5rem;
    }
    #judgement {
      font-size: 2rem;
      margin-top: 1rem;
      height: 2.5rem;
    }
    #controls {
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <nav class="container-fluid">
    <ul><li><strong>リズムタップゲーム</strong></li></ul>
    <ul>
      <li><a href="#">ホーム</a></li>
      <li><a href="#">遊び方</a></li>
      <li><a href="#" role="button" id="startBtn">スタート</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="grid">
      <section>
        <hgroup>
          <h2>タイミング音ゲー</h2>
          <h3>落ちてくるタイルを叩け！</h3>
        </hgroup>
        <div id="controls">
          <label for="speed">落下速度を選択：</label>
          <select id="speed">
            <option value="slow">遅い</option>
            <option value="normal" selected>普通</option>
            <option value="fast">速い</option>
          </select>
        </div>
        <div id="gameArea">
          <div id="hitLine"></div>
        </div>
        <div id="scoreBoard">Score: 0</div>
        <div id="judgement"></div>
        <p>操作方法：スペースキー または クリックで判定</p>
      </section>
    </div>
  </main>

  <footer class="container">
    <small>
      <a href="#">利用規約</a> • <a href="#">プライバシー</a>
    </small>
  </footer>

  <script>
    const gameArea = document.getElementById("gameArea");
    const scoreBoard = document.getElementById("scoreBoard");
    const judgement = document.getElementById("judgement");
    const startBtn = document.getElementById("startBtn");
    const speedSelect = document.getElementById("speed");

    let score = 0;
    let tiles = [];
    let noteIndex = 0;
    let gameStarted = false;
    let fallSpeed = 30; // msごとの落下間隔
    let fallStep = 5;   // 1ステップの落下量

    // タイミングデータ（秒単位のシンプルな譜面）
    const notes = [1, 2, 3.5, 5, 6.2, 7.5, 9, 10.5, 12];

    function spawnTile() {
      const tile = document.createElement("div");
      tile.classList.add("tile");
      tile.style.top = "-100px";
      gameArea.appendChild(tile);
      tiles.push(tile);

      let pos = -100;
      const fall = setInterval(() => {
        pos += fallStep;
        tile.style.top = pos + "px";
        if (pos > 500) {
          clearInterval(fall);
          if (gameArea.contains(tile)) {
            gameArea.removeChild(tile);
            tiles.shift();
            showJudgement("Miss");
          }
        }
      }, fallSpeed);
    }

    function checkHit() {
      if (tiles.length > 0) {
        const tile = tiles[0];
        const tileBottom = parseInt(tile.style.top) + 100;
        if (tileBottom >= 450 && tileBottom <= 500) {
          score += 100;
          scoreBoard.textContent = "Score: " + score;
          showJudgement("Perfect!");
          gameArea.removeChild(tile);
          tiles.shift();
        } else {
          showJudgement("Miss");
        }
      }
    }

    function showJudgement(text) {
      judgement.textContent = text;
      setTimeout(() => judgement.textContent = "", 500);
    }

    function startGame() {
      if (gameStarted) return;
      gameStarted = true;
      score = 0;
      scoreBoard.textContent = "Score: 0";
      noteIndex = 0;

      // 選択された速度に応じて落下スピードを調整
      const speed = speedSelect.value;
      if (speed === "slow") {
        fallSpeed = 40; fallStep = 4;
      } else if (speed === "normal") {
        fallSpeed = 30; fallStep = 5;
      } else if (speed === "fast") {
        fallSpeed = 20; fallStep = 6;
      }

      let startTime = Date.now();

      // 譜面進行
      const interval = setInterval(() => {
        const currentTime = (Date.now() - startTime) / 1000; // 秒換算
        if (noteIndex < notes.length && currentTime >= notes[noteIndex]) {
          spawnTile();
          noteIndex++;
        }
        if (noteIndex >= notes.length && tiles.length === 0) {
          clearInterval(interval);
          showJudgement("終了！");
        }
      }, 50);
    }

    document.body.addEventListener("keydown", e => {
      if (e.code === "Space") {
        checkHit();
      }
    });
    gameArea.addEventListener("click", checkHit);
    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
